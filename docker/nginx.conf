server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 4m;   # voice clips are at most 3 MB
  }
  location = /health { proxy_pass http://api:8080; }

  # The JSON-LD vocabulary of JobPostings (PUBLIC_WEB_URL/ns/accommodations) comes from the API.
  location /ns/ { proxy_pass http://api:8080; }

  # Read-aloud recordings sit next to the widget script (/v1/bridge-onboarding.js looks in
  # /v1/audio/), but the build puts them in /audio/.
  location /v1/audio/ {
    alias /usr/share/nginx/html/audio/;
  }

  # Resume links (/r/<token>) open the hosted sign-up page, which restores the session.
  location /r/ {
    try_files $uri /index.html;
  }

  # The site has several pages (sign-up, staff, demo hosts); an unknown address gets a
  # "page not found" page instead of silently opening the sign-up.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
