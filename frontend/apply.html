<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apply for a job | Bridge Onboarding</title>
    <style>
      :root {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #ffffff;
      }
      :root[data-theme='dark'],
      :root[data-theme='dark'] body {
        background-color: #0f141c;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']),
        :root:not([data-theme='light']) body {
          background-color: #0f141c;
        }
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <!--
      Our hosted "apply for this job" page: /apply.html?job=<job id>. Every JobPosting we
      publish links here (its "url"), so a job board or search engine that shows one of our
      jobs can send the learner back to apply with Bridge (sign-up first if needed). Without a
      valid job id it shows the job list.
    -->
    <main>
      <bridge-onboarding id="bridge" partner="pk_demo_savanna" flow="jobs"></bridge-onboarding>
    </main>
    <script>
      (function () {
        var id = new URLSearchParams(window.location.search).get('job') || '';
        if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return;
        var el = document.getElementById('bridge');
        el.setAttribute('flow', 'job-application');
        el.setAttribute('job-id', id);
        // The same JobPosting JSON-LD in this page, so search engines (Google for Jobs) can
        // read the job and its supports here too.
        fetch('/api/v1/jobs/' + id + '/jobposting.jsonld')
          .then(function (res) {
            return res.ok ? res.text() : null;
          })
          .then(function (text) {
            if (!text) return;
            var s = document.createElement('script');
            s.type = 'application/ld+json';
            s.textContent = text;
            document.head.appendChild(s);
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
