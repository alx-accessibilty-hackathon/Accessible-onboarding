<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · ገጹ አልተገኘም | Bridge Onboarding</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: 'Noto Sans Ethiopic', 'Ebrima', 'Nyala', system-ui, sans-serif;
        font-size: 18px;
        line-height: 1.6;
        color: #1b1f24;
        background: #ffffff;
        overflow-wrap: anywhere;
      }
      main {
        max-width: 36em;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.6em;
        line-height: 1.3;
        margin: 0 0 16px;
      }
      h1 span {
        display: block;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 24px 0 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      a {
        display: inline-block;
        min-height: 48px;
        padding: 10px 0;
        color: #cc3636;
        font-weight: 700;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #1a5fd0;
        outline-offset: 2px;
      }
      [lang='am'] {
        line-height: 1.7;
      }
      /* Read aloud (added by /src/notfound/main.ts; the page works without it) */
      .notice {
        margin: 0 0 16px;
        padding: 12px 16px;
        border: 2px solid #12305a;
        border-radius: 8px;
        background: #eaf0f7;
        color: #12305a;
      }
      .notice p {
        margin: 0;
      }
      .read-aloud {
        min-height: 48px;
        min-width: 48px;
        margin: 0 0 16px;
        padding: 0.4em 0.8em;
        font: inherit;
        font-weight: 700;
        color: #1b1f24;
        background: #ffffff;
        border: 2px solid #6b7280;
        border-radius: 8px;
        cursor: pointer;
      }
      .read-aloud[aria-pressed='true'] {
        background: #fbeaea;
        border-color: #cc3636;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="bo-notice" class="notice" hidden></div>
      <button id="bo-read-aloud" class="read-aloud" type="button" aria-pressed="false" hidden>
        Read aloud
      </button>
      <h1>
        <span lang="am">ገጹ አልተገኘም</span>
        <span>Page not found</span>
      </h1>
      <p lang="am">የፈለጉት አድራሻ የለም። ከታች ካሉት አንዱን ይምረጡ።</p>
      <p>There is no page at this address. Choose one of these:</p>
      <ul>
        <li>
          <a href="/"><span lang="am">ይመዝገቡ</span> <span aria-hidden="true">·</span> Sign up</a>
        </li>
        <li>
          <a href="/demo/savanna/jobs.html"
            ><span lang="am">ስራ ያግኙ</span> <span aria-hidden="true">·</span> Find a job</a
          >
        </li>
        <li>
          <a href="/staff.html"
            ><span lang="am">የሰራተኞች መግቢያ</span> <span aria-hidden="true">·</span> Staff sign-in</a
          >
        </li>
      </ul>
      <div id="bo-live" role="status" aria-live="polite" class="visually-hidden"></div>
    </main>
    <script type="module" src="/src/notfound/main.ts"></script>
  </body>
</html>
