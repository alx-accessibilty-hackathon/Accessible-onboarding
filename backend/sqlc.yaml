# sqlc turns the SQL in Repository/queries/ into type-safe Go in Repository/sqlc/.
# Run `sqlc generate` after changing a migration or a query, and commit the generated code.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations" # goose migrations; sqlc ignores the "-- +goose Down" parts
    queries: "Repository/queries" # one .sql file per table group
    gen:
      go:
        package: "sqlc"
        out: "Repository/sqlc" # generated: never edit by hand
        sql_package: "pgx/v5"
        emit_interface: true # a Querier interface, handy for fakes in tests
        emit_empty_slices: true # empty lists come back as [] instead of nil
        emit_pointers_for_null_types: true # nullable columns become pointers (*string, *time.Time)
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
