name: Frontend Checks

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", "shared/**", ".github/workflows/frontend-checks.yml"]
  pull_request:
    branches: ["main"]
    paths: ["frontend/**", "shared/**", ".github/workflows/frontend-checks.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes accessibility rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build pages
        run: npm run build

      - name: Build widget
        run: npm run build:widget

      - name: Size budget (150 KB gzipped)
        run: npm run size

      # Next: end-to-end tests with axe (npm run e2e) once they pass locally:
      #   - run: npx playwright install --with-deps chromium
      #   - run: npm run e2e
